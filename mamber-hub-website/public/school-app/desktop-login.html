<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sign in — School Management System</title>
  <link rel="icon" href="./icons/icon-192.png" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
      font-family: Inter, "Segoe UI", system-ui, sans-serif; background: #0f172a; color: #0f172a;
    }
    .card { width: 100%; max-width: 440px; background: #fff; border-radius: 28px; padding: 36px 28px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,.35); }
    .card img { width: 120px; height: auto; border-radius: 18px; }
    h1 { font-size: 22px; margin: 18px 0 8px; }
    p { color: #475569; line-height: 1.6; margin: 0 0 22px; font-size: 15px; }
    .spinner { width: 34px; height: 34px; margin: 6px auto 18px; border: 4px solid #bfdbfe; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    button {
      width: 100%; height: 56px; border-radius: 16px; border: 2px solid #e2e8f0; background: #fff;
      font-size: 17px; font-weight: 700; display: none; align-items: center; justify-content: center; gap: 12px; cursor: pointer;
    }
    button.show { display: flex; }
    button:hover { background: #f8fafc; border-color: #93c5fd; }
    button:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: 18px; font-size: 14px; font-weight: 600; }
    .err { color: #dc2626; }
    .ok { color: #059669; }
    .ur { font-family: "Noto Nastaliq Urdu", serif; direction: rtl; font-size: 15px; color: #64748b; margin-top: 10px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <img src="./icons/icon-192.png" alt="School Management System" />
    <h1>School Management System</h1>
    <div id="spinner" class="spinner"></div>
    <p id="intro">Opening Google sign-in…</p>
    <button id="btn" type="button">
      <svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span>Continue with Google</span>
    </button>
    <div id="ur" class="ur">گوگل لاگ ان کھل رہا ہے…</div>
    <div id="msg" class="msg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut,
      browserSessionPersistence, setPersistence
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    // authDomain is this website: /__/auth/* is forwarded to Firebase by a
    // Cloudflare Pages Function, so the redirect sign-in works in every browser.
    const onSite = location.hostname === "mamber-hub-website.pages.dev";
    const app = initializeApp({
      apiKey: "AIzaSyCJahqp6bUzU0JTW8Hk78oJABs2StK8Vjk",
      authDomain: onSite ? "mamber-hub-website.pages.dev" : "school-management-system-d3e44.firebaseapp.com",
      projectId: "school-management-system-d3e44",
      appId: "1:413750037301:web:8eb34713f74988a1f19a7c",
    });
    const auth = getAuth(app);

    const KEY = "sms_desktop_login";
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");
    const intro = document.getElementById("intro");
    const ur = document.getElementById("ur");
    const spinner = document.getElementById("spinner");

    const isValid = (p) => p && /^\d{2,5}$/.test(p.port) && Number(p.port) > 1023 && Number(p.port) < 65536 && /^[a-f0-9]{32}$/.test(p.state);

    // The Windows app opens this page with ?port=…&state=…; keep them for the round trip to Google.
    const params = new URLSearchParams(location.search);
    let pending = { port: params.get("port") || "", state: params.get("state") || "" };
    if (isValid(pending)) {
      let prev = null;
      try { prev = JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch { prev = null; }
      // Same sign-in coming back from Google keeps its "started" flag (no redirect loop).
      pending = prev && prev.state === pending.state ? prev : { ...pending, started: false };
      sessionStorage.setItem(KEY, JSON.stringify(pending));
    } else {
      try { pending = JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch { pending = null; }
    }

    function showButton(text, urText, isError) {
      spinner.classList.add("hidden");
      intro.textContent = text;
      ur.textContent = urText;
      btn.disabled = false;
      btn.classList.add("show");
      if (isError) { msg.className = "msg err"; }
    }

    async function startGoogle() {
      btn.disabled = true;
      msg.textContent = "";
      const saved = JSON.parse(sessionStorage.getItem(KEY) || "{}");
      sessionStorage.setItem(KEY, JSON.stringify({ ...saved, started: true }));
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      await setPersistence(auth, browserSessionPersistence);
      await signInWithRedirect(auth, provider);
    }

    btn.addEventListener("click", () => {
      startGoogle().catch(() => showButton("Could not open Google. Please try again.", "گوگل نہیں کھل سکا۔ دوبارہ کوشش کریں۔", true));
    });

    (async () => {
      if (!isValid(pending)) {
        spinner.classList.add("hidden");
        intro.textContent = "Open this page from the School Management System Windows app (Continue with Google).";
        ur.textContent = "یہ صفحہ اسکول مینجمنٹ سسٹم کی ونڈوز ایپ سے کھولیں۔";
        return;
      }
      try {
        const result = await getRedirectResult(auth);
        if (result) {
          const credential = GoogleAuthProvider.credentialFromResult(result);
          if (!credential || !credential.idToken) throw new Error("no-token");
          spinner.classList.add("hidden");
          intro.textContent = "Signed in. Returning to the app…";
          ur.textContent = "لاگ ان ہو گیا۔ ایپ کھل رہی ہے…";
          msg.className = "msg ok";
          sessionStorage.removeItem(KEY);
          try { await signOut(auth); } catch { /* the app keeps its own sign-in */ }
          // Hand the Google ID token to the Windows app listening on this computer only.
          location.replace(`http://127.0.0.1:${pending.port}/callback?state=${pending.state}&id_token=${encodeURIComponent(credential.idToken)}`);
          return;
        }
        if (pending.started) {
          // Came back from Google without choosing an account.
          showButton("Sign-in was not completed. Click the button to try again.", "لاگ ان مکمل نہیں ہوا۔ دوبارہ کوشش کے لیے بٹن دبائیں۔", false);
          return;
        }
        // First visit: go straight to Google's account chooser.
        await startGoogle();
      } catch (e) {
        showButton("Could not sign in. Please try again.", "لاگ ان نہیں ہو سکا۔ دوبارہ کوشش کریں۔", true);
      }
    })();
  </script>
</body>
</html>
